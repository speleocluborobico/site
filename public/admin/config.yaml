backend:
  name: github
  repo: speleocluborobico/site
media_folder: "src/assets/images" # Location where files will be stored in the repo
public_folder: "src/assets/images" # The src attribute for uploaded media
collections:
  - name: "grotte" # Used in routes, e.g., /admin/collections/blog
    label: "Grotte" # Used in the UI
    folder: "src/grotte" # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    fields: # The fields for each document, usually in frontmatter
      - { label: "Layout", name: "layout", widget: "hidden", default: "./layouts/Layout.astro" }
      - { label: "Nome", name: "title", widget: "string" }
      - { label: "Codice", name: "code", widget: "string" }
      - { label: "Comune", name: "comune", widget: "string" }
      - { label: "Body", name: "body", widget: "markdown" }
  - name: "pages"
    label: "Pagine"
    label_singular: "Pagina"
    folder: "src/content/docs"
    create: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Body", name: "body", widget: "markdown" }
